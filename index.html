
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="styles.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Practice client for a notes REST API</p>
  </header>

  <main>
    <section>
      <h2>My Notes</h2>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite">
        Click "Load notes" to get notes from the server.
      </p>
      <ul id="notes-list"></ul>
    </section>

    <section>
      <h2>Create a Note</h2>
      <form id="note-form">
        <label for="title-input">Title (required, maximum 100 characters)</label>
        <input
          id="title-input"
          name="title"
          type="text"
          maxlength="100"
          required
        >

        <label for="body-input">Body (optional)</label>
        <textarea id="body-input" name="body" rows="4"></textarea>

        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>
  </main>

  <footer>
    <p>QuickNotes System Design Project</p>
  </footer>
</body>
</html>
